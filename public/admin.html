<!DOCTYPE html>
<html>
<head>
    <title>Admin | LAKSHYA 2K26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="college-header">
        <img src="college_logo.png" class="logo-img">
        <div class="header-text"><h1>LBRCE ADMIN</h1><p>LAKSHYA 2K26</p></div>
        <img src="lakshya_logo.png" class="logo-img">
    </div>

    <div class="card" style="max-width: 800px;">
        <h2>Upload Questions</h2>
        <input type="file" id="fileInput" accept=".xlsx">
        <button onclick="uploadFile()">UPLOAD EXCEL</button>
        <hr style="margin: 20px 0; opacity: 0.1;">
        <div id="admin-list"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            const formData = new FormData(); formData.append('file', file);
            const res = await fetch('/upload', { method: 'POST', body: formData });
            if(res.ok) alert("Questions Uploaded Successfully!");
        }

        socket.on("leaderboard", teams => {
            const container = document.getElementById("admin-list");
            container.innerHTML = "<h3>Live Team Status</h3>";
            Object.entries(teams).forEach(([token, team]) => {
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #333">
                        <span>Team ID: <b>${team.name}</b> | Q: ${team.currentQ} ${team.dq ? '<b style="color:red">(DQ)</b>' : ''}</span>
                        <button onclick="qualify('${token}')" style="width:auto; padding:5px 15px;">Qualify</button>
                    </div>`;
            });
        });

        function qualify(token) { socket.emit("qualify_team", token); }
    </script>
</body>
</html>
