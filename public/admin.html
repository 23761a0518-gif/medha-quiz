<!DOCTYPE html>
<html>
<head>
    <title>Admin | LAKSHYA 2K26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="college-header">
        <img src="college_logo.png" class="logo-img">
        <div class="header-text"><h1>LBRCE ADMIN</h1><p>LAKSHYA 2K26</p></div>
        <img src="lakshya_logo.png" class="logo-img">
    </div>

    <div class="card" style="max-width: 800px;">
        <h2>Upload Questions</h2>
        <input type="file" id="fileInput" accept=".xlsx" style="margin-bottom: 10px;">
        <button onclick="uploadFile()">UPLOAD EXCEL</button>
        
        <hr style="margin: 20px 0; opacity: 0.2;">
        
        <h2>Team Management</h2>
        <div id="admin-list"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return alert("Select file!");
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch('/upload', { method: 'POST', body: formData });
            if(res.ok) alert("Questions Uploaded Successfully!");
        }

        socket.on("leaderboard", teams => {
            const container = document.getElementById("admin-list");
            container.innerHTML = "";
            Object.entries(teams).forEach(([token, team]) => {
                const row = document.createElement("div");
                row.style = "display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #333";
                row.innerHTML = `
                    <span>Team: <b>${team.name}</b> | Score: ${team.score} | Q: ${team.currentQ} 
                    ${team.dq ? '<b style="color:red"> (DQ)</b>' : '<b style="color:green"> (Active)</b>'}</span>
                    <button onclick="qualify('${token}')" style="width:auto; padding:5px 15px; margin:0;">QUALIFY</button>
                `;
                container.appendChild(row);
            });
        });

        function qualify(token) {
            socket.emit("qualify_team", token);
        }
    </script>
</body>
</html>
