<!DOCTYPE html>
<html>
<head><title>Admin | LAKSHYA</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="card" style="max-width: 800px;">
        <h2>Admin Panel</h2>
        <input type="file" id="fileInput" accept=".xlsx"><button onclick="uploadFile()">UPLOAD</button>
        <button onclick="if(confirm('Reset all?')) socket.emit('reset_all_data')" style="background:red">RESET SYSTEM</button>
        <div id="admin-list"></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit("register_monitor");
        async function uploadFile() {
            const fd = new FormData(); fd.append('file', document.getElementById('fileInput').files[0]);
            await fetch('/upload', { method: 'POST', body: fd });
            alert("Uploaded!");
        }
        socket.on("leaderboard", teams => {
            const container = document.getElementById("admin-list");
            container.innerHTML = "<h3>Team Status</h3>";
            Object.entries(teams).forEach(([token, team]) => {
                container.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333">
                    <span>Team: ${team.name} | Q: ${team.currentQ} ${team.dq?'<b style="color:red">(DQ)</b>':''}</span>
                    <button onclick="socket.emit('qualify_team', '${token}')">Qualify</button>
                </div>`;
            });
        });
    </script>
</body>
</html>
