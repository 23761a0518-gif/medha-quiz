<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>MEDHA – LAKSHYA 2K26</title>
</head>
<body>
<h1>MEDHA – LAKSHYA 2K26</h1>
<input id="name" placeholder="Team Name">
<button onclick="join()">Join Quiz</button>

<script src="/socket.io/socket.io.js"></script>
<script>
if(localStorage.getItem("joined")) {
  document.body.innerHTML="<h1>DISQUALIFIED</h1>";
}

const socket = io();
function join(){
  const teamName = document.getElementById("name").value.trim();
  if(!teamName){
    alert("Enter team name");
    return;
  }

  const token = Date.now()+"_"+Math.random();
  localStorage.setItem("joined","yes");
  localStorage.setItem("token",token);

  socket.emit("join", {
    name: teamName,
    id: token
  });

  window.location = "quiz.html";
}

</script>
</body>
</html>
