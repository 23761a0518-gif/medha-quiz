<!DOCTYPE html>
<html>
<head>
  <title>MEDHA Quiz - Join</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MEDHA – LAKSHYA 2K26</h1>
  <div id="box">
    <input id="name" placeholder="Team Name">
    <button onclick="join()">Join Quiz</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    if (localStorage.getItem("joined")) {
      document.body.innerHTML = "<h2>You already attempted this quiz.</h2>";
    }

    function join() {
      const name = document.getElementById("name").value.trim();
      if (!name) return alert("Enter team name");

      const token = crypto.randomUUID();
      localStorage.setItem("joined", "yes");
      localStorage.setItem("token", token);

      socket.emit("join", { name, token });
      // Small timeout to ensure socket sends data before page leaves
      setTimeout(() => { window.location.href = "/quiz"; }, 100);
    }
  </script>
</body>
</html>
