<!DOCTYPE html>
<html>
<head>
  <title>MEDHA – LAKSHYA 2K26</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>MEDHA Quiz</h1>

<script>
if (localStorage.getItem("joined")) {
  document.body.innerHTML = "<h2>You already attempted this quiz.</h2>";
}
</script>

<div id="joinBox">
  <input id="name" placeholder="Team Name">
  <button onclick="join()">Join Quiz</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

function join() {
  const name = document.getElementById("name").value.trim();
  if (!name) return alert("Enter team name");

  const token = crypto.randomUUID();
  localStorage.setItem("joined", "yes");
  localStorage.setItem("token", token);

  socket.emit("join", { name, token });
  window.location = "quiz.html";
}

socket.on("blocked", msg => {
  alert(msg);
  document.body.innerHTML = "<h2>Access Blocked</h2>";
});
</script>

</body>
</html>
