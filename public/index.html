<!DOCTYPE html>
<html>
<head>
  <title>MEDHA – LAKSHYA 2K26</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>MEDHA – LAKSHYA 2K26</h1>

<div id="joinBox">
  <input id="teamName" placeholder="Enter Team Name">
  <button onclick="join()">Join Quiz</button>
</div>

<h2 id="msg"></h2>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// BLOCK reattempt from same device
if (localStorage.getItem("joined") === "yes") {
  document.body.innerHTML = "<h1>❌ Reattempt not allowed</h1>";
}

function join() {
  const name = teamName.value.trim();
  if (!name) {
    alert("Enter team name");
    return;
  }

  const token = Date.now() + "_" + Math.random();

  localStorage.setItem("joined", "yes");
  localStorage.setItem("token", token);

  socket.emit("join", { name, id: token });
  location.href = "quiz.html";
}
</script>

</body>
</html>
