<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>MEDHA – LAKSHYA 2K26</title>
</head>
<body>

<h1>MEDHA – LAKSHYA 2K26</h1>

<input id="teamName" placeholder="Enter Team Name" />
<button onclick="join()">Join Quiz</button>

<script>
function join() {
  const name = document.getElementById("teamName").value.trim();
  if (!name) {
    alert("Enter team name");
    return;
  }

  // generate unique team token
  const teamToken = Date.now() + "_" + Math.random().toString(36).slice(2);

  // store in browser
  localStorage.setItem("teamName", name);
  localStorage.setItem("teamToken", teamToken);

  // go to quiz page
  window.location.href = "quiz.html";
}
</script>

</body>
</html>
