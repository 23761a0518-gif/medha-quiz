<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Enter Team Name</h2>
<input id="team" placeholder="Team Name">
<button onclick="join()">Join Quiz</button>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// device lock
if (localStorage.getItem("joined")) {
  document.body.innerHTML = "<h1>DISQUALIFIED<br>Reattempt Not Allowed</h1>";
}

function join() {
  const name = team.value.trim();
  if (!name) {
    alert("Enter team name");
    return;
  }

  const device = navigator.userAgent;

  localStorage.setItem("joined", "yes");
  localStorage.setItem("quizDone", "no");

  socket.emit("join", { name, device });
  window.location = "quiz.html";
}
</script>

</body>
</html>
