<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="q"></h2>
<div id="ops"></div>
<p id="timer"></p>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let questions = [];
let i = 0;
let time = 15;
let timerInterval;
let warnings = 0;
let quizFinished = false;

// 🔴 Refresh = DISQUALIFY
window.onbeforeunload = () => {
  if (!quizFinished) {
    socket.emit("warn");
  }
};

// 🚫 Tab switch only DURING quiz
document.addEventListener("visibilitychange", () => {
  if (!quizFinished && document.hidden) warn();
});
window.addEventListener("blur", () => {
  if (!quizFinished) warn();
});

function warn() {
  warnings++;
  socket.emit("warn");
  if (warnings >= 2) {
    document.body.innerHTML = "<h1>❌ DISQUALIFIED</h1>";
  }
}

// FETCH QUESTIONS
fetch("/questions")
  .then(res => res.json())
  .then(data => {
    questions = data;
    if (questions.length === 0) {
      document.body.innerHTML = "<h1>No Questions Uploaded</h1>";
      return;
    }
    loadQuestion();
  });

function loadQuestion() {
  if (i >= questions.length) {
    quizFinished = true;
    localStorage.setItem("quizFinished", "yes");
    document.body.innerHTML = "<h1>✅ Quiz Completed</h1>";
    return;
  }

  const qData = questions[i];
  q.innerText = qData.Question;
  ops.innerHTML = "";

  ["A","B","C","D"].forEach(opt => {
    const btn = document.createElement("button");
    btn.innerText = qData[opt];
    btn.onclick = () => submitAnswer(opt);
    ops.appendChild(btn);
  });

  time = 15;
  timer.innerText = "Time: " + time;

  timerInterval = setInterval(() => {
    time--;
    timer.innerText = "Time: " + time;
    if (time <= 0) {
      clearInterval(timerInterval);
      i++;
      loadQuestion();
    }
  }, 1000);
}

function submitAnswer(choice) {
  clearInterval(timerInterval);
  socket.emit(
    "answer",
    choice === questions[i].Answer.trim()
  );
  i++;
  loadQuestion();
}
</script>

</body>
</html>
