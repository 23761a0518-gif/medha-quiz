<!DOCTYPE html>
<html>
<head><title>Quiz | LAKSHYA 2K26</title><link rel="stylesheet" href="style.css"></head>
<body oncontextmenu="return false;">
    <div class="college-header">
        <img src="college_logo.png" class="logo-img">
        <div class="header-text"><h1>LBRCE CSE</h1><p id="overview">Loading...</p></div>
        <img src="lakshya_logo.png" class="logo-img">
    </div>
    <div class="card" id="quiz-container">
        <div id="timer" style="font-weight: bold; color: var(--primary); margin-bottom: 10px;">Time: 15</div>
        <h3 id="q">Waiting for server...</h3>
        <div id="ops"></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const token = localStorage.getItem("token");
        let questions = [], i = 0, timerId, isDq = false;

        if (!token) location.href = "index.html";
        socket.emit("rejoin", token);
        socket.on("force_dq", () => showDQ());
        socket.on("force_logout", () => { localStorage.clear(); location.href="index.html"; });

        socket.on("sync_state", data => {
            i = data.currentQ;
            if (data.dq) return showDQ();
            if (data.completed) return showFinished();
            fetch("/questions").then(r => r.json()).then(qs => { questions = qs; load(); });
        });

        socket.on("restored", t => { if (t === token) location.reload(); });

        function load() {
            if (i >= questions.length) return showFinished();
            document.getElementById("overview").innerText = `Question ${i + 1} of ${questions.length}`;
            const q = questions[i];
            document.getElementById("q").innerText = q.Question;
            const ops = document.getElementById("ops");
            ops.innerHTML = "";
            ["A","B","C","D"].forEach(k => {
                const btn = document.createElement("button");
                btn.innerText = q[k];
                btn.onclick = () => {
                    if(isDq) return;
                    clearInterval(timerId);
                    socket.emit("answer", { correct: k === q.Answer.trim() });
                    i++; load();
                };
                ops.appendChild(btn);
            });
            startTimer();
        }

        function startTimer() {
            let time = 15; clearInterval(timerId);
            timerId = setInterval(() => {
                document.getElementById("timer").innerText = "Time: " + time--;
                if (time < 0) { socket.emit("answer", { correct: false }); i++; load(); }
            }, 1000);
        }

        function showDQ() {
            isDq = true; clearInterval(timerId);
            document.getElementById("quiz-container").innerHTML = `<h1 style="color:red">DISQUALIFIED</h1><p>Tab switching detected. Contact Admin.</p>`;
        }

        function showFinished() { document.getElementById("quiz-container").innerHTML = `<h2>Quiz Completed!</h2>`; }

        function triggerDQ() { if (!isDq) { socket.emit("dq_signal"); showDQ(); } }
        window.onblur = triggerDQ;
        document.addEventListener("visibilitychange", () => { if (document.hidden) triggerDQ(); });
    </script>
</body>
</html>
