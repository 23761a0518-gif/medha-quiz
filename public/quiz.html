<!DOCTYPE html>
<html>
<head>
  <title>MEDHA Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="q"></h2>
<div id="ops"></div>
<p id="timer"></p>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let questions = [];
let i = 0;
let time = 15;
let intv;
let completed = false;

fetch("/questions")
  .then(r => r.json())
  .then(d => {
    questions = d;
    load();
  });

function load() {
  if (i >= questions.length) {
    completed = true;
    document.body.innerHTML = "<h1>Quiz Completed</h1>";
    return;
  }

  const q = questions[i];
  document.getElementById("q").innerText = q.Question;

  const ops = document.getElementById("ops");
  ops.innerHTML = "";

  ["A","B","C","D"].forEach(k => {
    const btn = document.createElement("button");
    btn.innerText = q[k];
    btn.onclick = () => submitAnswer(k === q.Answer.trim());
    ops.appendChild(btn);
  });

  time = 15;
  intv = setInterval(() => {
    document.getElementById("timer").innerText = "Time: " + time--;
    if (time < 0) next();
  }, 1000);
}

function submitAnswer(isCorrect) {
  clearInterval(intv);
  socket.emit("answer", { correct: isCorrect });
  next();
}

function next() {
  clearInterval(intv);
  i++;
  load();
}

// anti-cheat only DURING quiz
document.addEventListener("visibilitychange", () => {
  if (!completed && document.hidden) disqualify();
});
window.addEventListener("blur", () => {
  if (!completed) disqualify();
});
window.onbeforeunload = () => {
  if (!completed) disqualify();
};

function disqualify() {
  socket.emit("dq");
  document.body.innerHTML = "<h1>DISQUALIFIED</h1>";
}
</script>

</body>
</html>
