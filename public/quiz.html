<!DOCTYPE html>
<html>
<head>
  <title>MEDHA Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="q"></h2>
<div id="ops"></div>
<p id="timer"></p>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let questions = [];
let index = 0;
let time = 15;
let timer;
let completed = false;

fetch("/questions")
  .then(r => r.json())
  .then(d => {
    questions = d;
    load();
  });

function load() {
  if (index >= questions.length) {
    completed = true;
    document.body.innerHTML = "<h1>Quiz Completed</h1>";
    return;
  }

  const q = questions[index];
  document.getElementById("q").innerText = q.Question;

  const ops = document.getElementById("ops");
  ops.innerHTML = "";

  ["A","B","C","D"].forEach(k => {
    const btn = document.createElement("button");
    btn.innerText = q[k];
    btn.onclick = () => submit(k === q.Answer.trim());
    ops.appendChild(btn);
  });

  time = 15;
  timer = setInterval(() => {
    document.getElementById("timer").innerText = "Time: " + time--;
    if (time < 0) next();
  }, 1000);
}

function submit(correct) {
  clearInterval(timer);
  socket.emit("answer", { correct });
  next();
}

function next() {
  clearInterval(timer);
  index++;
  load();
}

/* Anti-cheat ONLY during quiz */
document.addEventListener("visibilitychange", () => {
  if (!completed && document.hidden) dq();
});
window.addEventListener("blur", () => {
  if (!completed) dq();
});
window.onbeforeunload = () => {
  if (!completed) dq();
};

function dq() {
  socket.emit("dq");
  document.body.innerHTML = "<h1>DISQUALIFIED</h1>";
}
</script>

</body>
</html>
