<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>MEDHA Quiz</title>
</head>
<body>

<h2 id="q"></h2>
<div id="ops"></div>
<p id="timer"></p>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// get team info
const teamName = localStorage.getItem("teamName");
const teamToken = localStorage.getItem("teamToken");

if (!teamName || !teamToken) {
  document.body.innerHTML = "<h1>Unauthorized access</h1>";
  throw new Error("No team info");
}

// register team again with server (IMPORTANT)
socket.emit("join", {
  name: teamName,
  id: teamToken
});

let questions = [];
let index = 0;
let time = 15;
let timerInterval;
let warnings = 0;

// load questions
fetch("/questions")
  .then(res => res.json())
  .then(data => {
    questions = data;
    if (questions.length === 0) {
      document.body.innerHTML = "<h1>No questions uploaded</h1>";
      return;
    }
    loadQuestion();
  });

function loadQuestion() {
  if (index >= questions.length) {
    document.body.innerHTML = "<h1>Quiz Completed</h1>";
    return;
  }

  const q = questions[index];
  document.getElementById("q").innerText = q.Question;

  const opsDiv = document.getElementById("ops");
  opsDiv.innerHTML = "";

  ["A", "B", "C", "D"].forEach(opt => {
    const btn = document.createElement("button");
    btn.innerText = q[opt];
    btn.onclick = () => answer(opt);
    opsDiv.appendChild(btn);
    opsDiv.appendChild(document.createElement("br"));
  });

  time = 15;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    document.getElementById("timer").innerText = "Time: " + time;
    time--;
    if (time < 0) next();
  }, 1000);
}

function answer(selected) {
  clearInterval(timerInterval);
  const correct = selected === questions[index].Answer.trim();
  socket.emit("answer", correct);
  next();
}

function next() {
  index++;
  loadQuestion();
}

// anti-cheat
document.addEventListener("visibilitychange", warn);
window.addEventListener("blur", warn);

function warn() {
  warnings++;
  socket.emit("warn");
  if (warnings >= 2) {
    document.body.innerHTML = "<h1>DISQUALIFIED</h1>";
  }
}
</script>

</body>
</html>
