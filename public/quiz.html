<!DOCTYPE html>
<html>
<head>
    <title>Quiz | MEDHA 2K26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="college-header">
        <img src="college_logo.png" class="logo-img">
        <div class="header-text">
            <h1>LAKIREDDY BALI REDDY COLLEGE OF ENGINEERING</h1>
            <p>CSE BRANCH | LAKSHYA 2K26</p>
        </div>
        <img src="lakshya_logo.png" class="logo-img">
    </div>

    <div class="card">
        <div id="timer" style="font-weight: bold; color: var(--primary); margin-bottom: 10px;">Time: 15</div>
        <h3 id="q">Loading Questions...</h3>
        <div id="ops"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const token = localStorage.getItem("token");
        let questions = [], i = 0, time = 15, timerId, completed = false;

        if (token) socket.emit("rejoin", token);
        else window.location.href = "index.html";

        fetch("/questions").then(r => r.json()).then(d => { 
            questions = d; 
            if(questions.length > 0) load();
        });

        function load() {
            if (i >= questions.length) {
                completed = true;
                document.querySelector(".card").innerHTML = "<h2>Quiz Completed!</h2><p>Thanks for participating.</p>";
                return;
            }
            const q = questions[i];
            document.getElementById("q").innerText = q.Question;
            const ops = document.getElementById("ops");
            ops.innerHTML = "";

            ["A","B","C","D"].forEach(k => {
                const btn = document.createElement("button");
                btn.innerText = q[k];
                btn.onclick = () => {
                    Array.from(ops.getElementsByTagName('button')).forEach(b => b.disabled = true);
                    submit(k === q.Answer.trim());
                };
                ops.appendChild(btn);
            });

            time = 15;
            clearInterval(timerId);
            timerId = setInterval(() => {
                document.getElementById("timer").innerText = "Time: " + time--;
                if (time < 0) next();
            }, 1000);
        }

        function submit(correct) {
            clearInterval(timerId);
            socket.emit("answer", { correct });
            next();
        }

        function next() { i++; load(); }

        document.addEventListener("visibilitychange", () => { if (!completed && document.hidden) dq(); });
        window.addEventListener("blur", () => { if (!completed) dq(); });

        function dq() {
            socket.emit("dq");
            document.querySelector(".card").innerHTML = "<h1 style='color: #ff4b2b;'>DISQUALIFIED</h1><p>Tab switching is not allowed.</p>";
        }
    </script>
</body>
</html>
