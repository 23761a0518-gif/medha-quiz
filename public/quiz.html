<!DOCTYPE html>
<html>
<head>
  <title>MEDHA Quiz - Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2 id="q">Waiting for questions...</h2>
  <div id="ops"></div>
  <p id="timer"></p>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const token = localStorage.getItem("token");
    let questions = [], i = 0, time = 15, timerId, completed = false;

    if (token) socket.emit("rejoin", token);
    else window.location.href = "/";

    fetch("/questions")
      .then(r => r.json())
      .then(d => { 
        questions = d; 
        if(questions.length > 0) load(); 
        else document.getElementById("q").innerText = "No questions uploaded yet.";
      });

    function load() {
      if (i >= questions.length) {
        completed = true;
        document.body.innerHTML = "<h1>Quiz Completed! Check Leaderboard.</h1>";
        return;
      }
      const q = questions[i];
      document.getElementById("q").innerText = q.Question;
      const ops = document.getElementById("ops");
      ops.innerHTML = "";

      ["A","B","C","D"].forEach(k => {
        const btn = document.createElement("button");
        btn.innerText = q[k];
        btn.onclick = () => {
          // Disable buttons to prevent double clicking
          Array.from(ops.getElementsByTagName('button')).forEach(b => b.disabled = true);
          submit(k === q.Answer.trim());
        };
        ops.appendChild(btn);
      });

      time = 15;
      clearInterval(timerId);
      timerId = setInterval(() => {
        document.getElementById("timer").innerText = "Time: " + time--;
        if (time < 0) next();
      }, 1000);
    }

    function submit(correct) {
      clearInterval(timerId);
      socket.emit("answer", { correct });
      next();
    }

    function next() {
      i++;
      load();
    }

    document.addEventListener("visibilitychange", () => { if (!completed && document.hidden) dq(); });
    window.addEventListener("blur", () => { if (!completed) dq(); });

    function dq() {
      socket.emit("dq");
      document.body.innerHTML = "<h1>DISQUALIFIED: Tab Switching Detected</h1>";
    }
  </script>
</body>
</html>
