<script>
    const socket = io();
    const token = localStorage.getItem("token");
    let questions = [], i = 0, timerId, isDq = false, isFinished = false;

    if (!token) location.href = "index.html";
    socket.emit("rejoin", token);
    
    socket.on("force_dq", () => showDQ());
    socket.on("force_logout", () => { localStorage.clear(); location.href="index.html"; });

    socket.on("sync_state", data => {
        i = data.currentQ;
        if (data.dq) return showDQ();
        if (data.completed) return showFinished();
        
        fetch("/questions").then(r => r.json()).then(qs => {
            questions = qs;
            load();
        });
    });

    socket.on("restored", t => { if (t === token) location.reload(); });

    function load() {
        if (i >= questions.length) return showFinished();
        document.getElementById("overview").innerText = `Question ${i + 1} of ${questions.length}`;
        const q = questions[i];
        document.getElementById("q").innerText = q.Question;
        const ops = document.getElementById("ops");
        ops.innerHTML = "";
        ["A","B","C","D"].forEach(k => {
            const btn = document.createElement("button");
            btn.innerText = q[k];
            btn.onclick = () => {
                if(isDq || isFinished) return;
                clearInterval(timerId);
                socket.emit("answer", { correct: k === q.Answer.trim() });
                i++; load();
            };
            ops.appendChild(btn);
        });
        startTimer();
    }

    function startTimer() {
        let time = 15; clearInterval(timerId);
        timerId = setInterval(() => {
            document.getElementById("timer").innerText = "Time: " + time--;
            if (time < 0) { socket.emit("answer", { correct: false }); i++; load(); }
        }, 1000);
    }

    function showDQ() {
        if (isFinished) return; // Don't DQ if already finished
        isDq = true; 
        clearInterval(timerId);
        document.getElementById("quiz-container").innerHTML = `<h1 style="color:red">DISQUALIFIED</h1><p>Tab switching detected. Contact Admin.</p>`;
    }

    function showFinished() { 
        isFinished = true; // Mark as finished to disable DQ logic
        clearInterval(timerId);
        document.getElementById("quiz-container").innerHTML = `<h2>Quiz Completed!</h2><p>You can now safely leave this page.</p>`; 
    }

    // FIXED DQ LOGIC: Only triggers if NOT finished and NOT already DQ'd
    function handleViolation() {
        if (!isDq && !isFinished) {
            socket.emit("dq_signal");
            showDQ();
        }
    }

    window.onblur = handleViolation;
    document.addEventListener("visibilitychange", () => { if (document.hidden) handleViolation(); });
</script>
