<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="q"></h2>
<div id="ops"></div>
<p id="timer"></p>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let questions = [];
let i = 0;
let time = 15;
let interval;
let warnings = 0;
let quizFinished = false;

// fetch questions
fetch("/questions")
  .then(r => r.json())
  .then(d => {
    questions = d;
    load();
  });

function load() {
  if (i >= questions.length) {
    quizFinished = true;
    localStorage.setItem("quizDone", "yes");
    document.body.innerHTML = "<h1>Quiz Completed</h1>";
    return;
  }

  q.innerText = questions[i].Question;
  ops.innerHTML = "";

  ["A","B","C","D"].forEach(k => {
    ops.innerHTML += `<button onclick="ans('${k}')">${questions[i][k]}</button><br>`;
  });

  time = 15;
  interval = setInterval(() => {
    timer.innerText = "Time: " + time--;
    if (time < 0) next();
  }, 1000);
}

function ans(choice) {
  clearInterval(interval);
  const correct = choice === questions[i].Answer.trim();
  socket.emit("answer", correct);
  next();
}

function next() {
  clearInterval(interval);
  i++;
  load();
}

// anti-cheat ONLY during quiz
document.addEventListener("visibilitychange", cheat);
window.addEventListener("blur", cheat);

function cheat() {
  if (quizFinished) return;

  warnings++;
  socket.emit("warn");

  if (warnings >= 2) {
    document.body.innerHTML = "<h1>DISQUALIFIED</h1>";
  }
}
</script>

</body>
</html>
