<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard | LAKSHYA 2K26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="college-header">
        <img src="college_logo.png" class="logo-img">
        <div class="header-text"><h1>LBRCE CSE</h1><p>LIVE RANKINGS</p></div>
        <img src="lakshya_logo.png" class="logo-img">
    </div>

    <div class="card" style="max-width: 800px;">
        <ul id="list"></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on("leaderboard", teams => {
            const list = document.getElementById("list");
            list.innerHTML = "";
            Object.values(teams)
                .sort((a,b) => b.score - a.score)
                .forEach(t => {
                    list.innerHTML += `<li><span>Team ${t.name}</span> <span>${t.score} pts ${t.dq?'❌':''}</span></li>`;
                });
        });
    </script>
</body>
</html>
