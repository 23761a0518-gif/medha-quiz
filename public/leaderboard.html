<!DOCTYPE html>
<html>
<body>

<h2>Live Leaderboard</h2>
<ul id="l"></ul>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

socket.on("leaderboard", data => {
  l.innerHTML = "";
  Object.values(data)
    .sort((a,b)=>b.score - a.score)
    .forEach(t => {
      l.innerHTML += `<li>${t.name} - ${t.score} ${t.dq ? "❌" : ""}</li>`;
    });
});
</script>

</body>
</html>
