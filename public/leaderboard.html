<!DOCTYPE html>
<html>
<head><title>Leaderboard</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="card" style="max-width: 800px;">
        <h1>LIVE RANKINGS</h1>
        <ul id="list"></ul>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit("register_monitor");
        socket.on("leaderboard", teams => {
            const list = document.getElementById("list");
            list.innerHTML = Object.values(teams).sort((a,b)=>b.score-a.score)
                .map(t => `<li><span>Team ${t.name}</span> <span>${t.score} pts ${t.dq?'❌':''}</span></li>`).join("");
        });
    </script>
</body>
</html>
