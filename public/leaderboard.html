<!DOCTYPE html>
<html>
<head><title>Leaderboard</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="college-header">
        <img src="college_logo.png" class="logo-img">
        <div class="header-text">
            <h1>LAKIREDDY BALI REDDY COLLEGE OF ENGINEERING </h1>
            <h2>LAKSHYA 2K26 - NATIONAL LEVEL TECHNICAL FEST</h2>
            <h3>MEDHA - Department of Computer Science and Engineering</h3>
            <p id="overview" style="color: #ffcc00; font-weight: bold; text-align: center;">LIVE LEADERBOARD</p>
        </div>
        <img src="lakshya_logo.png" class="logo-img">
    </div>
    <div class="card" style="max-width: 800px;">
        <h1>LIVE RANKINGS</h1>
        <ul id="list"></ul>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit("register_monitor");
        socket.on("leaderboard", teams => {
            const list = document.getElementById("list");
            list.innerHTML = Object.values(teams).sort((a,b)=>b.score-a.score)
                .map(t => `<li><span>Team ${t.name}</span> <span>${t.score} pts ${t.dq?'❌':''}</span></li>`).join("");
        });
    </script>
</body>
</html>
